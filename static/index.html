<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业级 NVMe SSD 缓存与性能分析系统</title>
    <meta
      name="description"
      content="面向企业级 NVMe SSD 的缓存算法、IO 性能、异常告警与测试结果分析平台"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/extended.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <aside>
      <div class="brand" aria-label="企业级 NVMe SSD 缓存与性能分析系统">
        <span class="mark">N</span>
        <div>NVMe <b>Analyzer</b><small>企业级缓存与性能分析</small></div>
      </div>
      <nav>
        <button class="active" data-view="overview">▦　概览</button>
        <button data-view="devices">◉　设备信息</button>
        <button data-view="analysis">⌁　结果分析</button>
        <button data-view="cache-lab">◇　缓存算法</button>
        <button data-view="alerts">△　告警中心</button>
        <button data-view="reports">▤　报告中心</button>
      </nav>
      <div class="side-footer">
        <i></i> 分析服务正常<br />
        <span>v1.1.0 · Analysis Only</span>
      </div>
    </aside>

    <main>
      <header>
        <div>
          <p class="eyebrow">ENTERPRISE STORAGE OBSERVABILITY</p>
          <h1 id="page-title">分析概览</h1>
        </div>
        <div class="header-actions">
          <span class="live"><i></i> 只读分析模式</span>
          <button class="secondary" id="load-demo">▶ 演示案例</button>
          <button class="primary import-trigger">＋ 导入测试结果</button>
        </div>
      </header>

      <section id="overview" class="view active">
        <div class="hero" tabindex="0" role="button">
          <div>
            <p>当前受管设备</p>
            <h2 id="device-count">— <span>NVMe SSD</span></h2>
            <small>仅采集设备信息，不执行压测</small>
          </div>
          <div class="hero-device" id="featured-device">
            <b>正在读取设备信息</b>
            <span>分析模式 · 不执行磁盘写入</span>
          </div>
        </div>
        <div class="metrics" id="overview-metrics"></div>
        <div class="panel">
          <div class="panel-head">
            <div>
              <h3>最近分析记录</h3>
              <p>来自 Benchmark、PressureTest、FIO 或算法场景</p>
            </div>
            <button class="secondary" id="refresh-overview">刷新</button>
          </div>
          <div id="recent-runs" class="recent-list"></div>
        </div>
      </section>

      <section id="devices" class="view">
        <div class="section-head">
          <div>
            <h2>NVMe 设备信息</h2>
            <p>只读识别设备，不提供 Benchmark 或 PressureTest 功能</p>
          </div>
          <button class="secondary" id="rescan">↻ 重新扫描</button>
        </div>
        <div class="device-list" id="device-list"></div>
      </section>

      <section id="analysis" class="view">
        <div class="section-head">
          <div>
            <h2>结果分析</h2>
            <p id="analysis-subtitle">导入已有测试结果，或选择历史分析记录</p>
          </div>
          <div class="toolbar">
            <select id="analysis-select" aria-label="选择分析记录"></select>
            <button class="primary import-trigger">导入 JSON</button>
          </div>
        </div>
        <div id="analysis-content"></div>
      </section>
    </main>

    <input
      id="result-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script src="/static/app.js"></script>
  </body>
</html>
